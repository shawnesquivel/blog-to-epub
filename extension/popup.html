<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blog to EPUB</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #171717;
      }
      .wrap {
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: #7c3aed;
      }
      .page {
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        background: #fafafa;
      }
      .page .title {
        font-size: 13px;
        font-weight: 500;
        color: #171717;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .page .host {
        margin-top: 2px;
        font-size: 11px;
        color: #737373;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button#convert {
        margin-top: 12px;
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 8px;
        background: #171717;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button#convert:hover:enabled {
        background: #262626;
      }
      button#convert:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.45;
        color: #737373;
        min-height: 17px;
      }
      #status.error {
        color: #b91c1c;
      }
      #status.success {
        color: #15803d;
      }
      .footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #f0f0f0;
        font-size: 11px;
        color: #a3a3a3;
      }
      .footer a {
        color: #7c3aed;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span> Blog to EPUB</div>

      <div class="page">
        <div class="title" id="page-title">Reading current tab…</div>
        <div class="host" id="page-host"></div>
      </div>

      <button id="convert" disabled>Create EPUB</button>

      <div id="status" data-state="idle"></div>

      <div class="footer">
        Converts this page locally — nothing is uploaded.
        <a href="https://blogtoepub.com" target="_blank" rel="noreferrer">blogtoepub.com</a>
      </div>
    </div>
    <iframe id="epub-sandbox" src="sandbox.html" style="display: none"></iframe>
    <script src="popup.js"></script>
  </body>
</html>
